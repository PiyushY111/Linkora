name: Linkora CI Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Integration & Unit Tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: mongodb://127.0.0.1:27017/linkora_test
          REDIS_URL: redis://127.0.0.1:6379/15
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
          JWT_SECRET: ci-pipeline-super-secret-jwt-key-32-chars-minimum
          FRONTEND_URL: http://localhost:3000

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Linter
        run: npm run lint

      - name: Run Frontend Test Suite
        run: npm test

      - name: Build Production Assets
        run: npm run build

  ci-status:
    name: CI Pipeline Status Check
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Status of Required Jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "CI pipeline failed. Backend: ${{ needs.backend.result }}, Frontend: ${{ needs.frontend.result }}"
            exit 1
          fi
          echo "All CI checks completed successfully!"
