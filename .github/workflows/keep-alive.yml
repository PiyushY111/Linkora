name: Keep Render Backend Awake

# Render's free tier sleeps a web service after 15 minutes without traffic.
# GitHub runs scheduled workflows only from the default branch and may start
# them late, so each run pings twice, five minutes apart, to cover the gaps.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ping backend health endpoint
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "Repository variable RENDER_HEALTH_URL is not set"
            exit 1
          fi

          ping() {
            # A cold start on Render can take close to a minute.
            curl --fail --silent --show-error --output /dev/null \
              --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
              --write-out "HTTP %{http_code} in %{time_total}s\n" \
              "$HEALTH_URL"
          }

          ping
          sleep 300
          ping
