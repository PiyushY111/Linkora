# Serves the built SPA and proxies the API, so the browser talks to a single
# origin. The API counts one proxy hop (TRUST_PROXY_HOPS=1 in compose).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Matches the API's own JSON limit for dashboard link create/update.
    client_max_body_size 3m;

    location /api/ {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://backend:5001;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is a client-side route, including /:shortCode.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
